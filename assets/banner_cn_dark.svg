<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-label="Absent Author: 科研和写作可以自动化，署名的责任不能。" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Absent Author: 科研和写作可以自动化，署名的责任不能。</title>
<rect width="1200" height="440" rx="18" fill="#151A21"/>
<rect x="54" y="48" width="400" height="360" rx="5" fill="#0E1217"/>
<rect x="48" y="40" width="400" height="360" rx="5" fill="#FFFFFF"/>
<text x="248.0" y="86.0" font-family="Georgia, 'Times New Roman', 'Songti SC', 'Noto Serif CJK SC', 'Noto Serif SC', serif" font-size="19" fill="#1D2430" font-weight="bold" font-style="normal" text-anchor="middle">Adaptive Gradient Scaling:</text>
<text x="248.0" y="110.0" font-family="Georgia, 'Times New Roman', 'Songti SC', 'Noto Serif CJK SC', 'Noto Serif SC', serif" font-size="19" fill="#1D2430" font-weight="bold" font-style="normal" text-anchor="middle">An Audit</text>
<rect x="152.0" y="126" width="192" height="30" rx="15" fill="none" stroke="#2747C7" stroke-width="1.6" stroke-dasharray="5 4"/>
<text x="248.0" y="147.0" font-family="Georgia, 'Times New Roman', 'Songti SC', 'Noto Serif CJK SC', 'Noto Serif SC', serif" font-size="15" fill="#2747C7" font-weight="normal" font-style="italic" text-anchor="middle">Anonymous Author(s)</text>
<text x="74.0" y="190.0" font-family="Georgia, 'Times New Roman', 'Songti SC', 'Noto Serif CJK SC', 'Noto Serif SC', serif" font-size="15.5" fill="#1D2430" font-weight="normal" font-style="normal" text-anchor="start">…scaling plays a pivotal role,</text>
<rect x="70" y="202" width="356" height="20" fill="#FFE45C" opacity="0.85"/>
<text x="74.0" y="217.0" font-family="Georgia, 'Times New Roman', 'Songti SC', 'Noto Serif CJK SC', 'Noto Serif SC', serif" font-size="15.5" fill="#1D2430" font-weight="normal" font-style="normal" text-anchor="start">highlighting the need for robustness.</text>
<rect x="70" y="229" width="356" height="20" fill="#FFE45C" opacity="0.85"/>
<text x="74.0" y="244.0" font-family="Georgia, 'Times New Roman', 'Songti SC', 'Noto Serif CJK SC', 'Noto Serif SC', serif" font-size="15.5" fill="#1D2430" font-weight="normal" font-style="normal" text-anchor="start">We do not claim it is optimal;</text>
<rect x="70" y="256" width="356" height="20" fill="#FFE45C" opacity="0.85"/>
<text x="74.0" y="271.0" font-family="Georgia, 'Times New Roman', 'Songti SC', 'Noto Serif CJK SC', 'Noto Serif SC', serif" font-size="15.5" fill="#1D2430" font-weight="normal" font-style="normal" text-anchor="start">contrary to our expectations, it</text>
<text x="74.0" y="298.0" font-family="Georgia, 'Times New Roman', 'Songti SC', 'Noto Serif CJK SC', 'Noto Serif SC', serif" font-size="15.5" fill="#1D2430" font-weight="normal" font-style="normal" text-anchor="start">fails, so we audit the schedule.</text>
<rect x="70" y="310" width="356" height="20" fill="#FFE45C" opacity="0.85"/>
<text x="74.0" y="325.0" font-family="Georgia, 'Times New Roman', 'Songti SC', 'Noto Serif CJK SC', 'Noto Serif SC', serif" font-size="15.5" fill="#1D2430" font-weight="normal" font-style="normal" text-anchor="start">Accuracy rises 16% (73.1 → 78.0).</text>
<rect x="74" y="356" width="340" height="6" rx="3" fill="#E3E7EC"/>
<rect x="74" y="372" width="270" height="6" rx="3" fill="#E3E7EC"/>
<path d="M 430 212 L 478 212" stroke="#93A6FF" stroke-width="1.6"/>
<rect x="480" y="199" width="52" height="26" rx="13" fill="#93A6FF"/>
<text x="506.0" y="217.5" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="15" fill="#0E1217" font-weight="bold" font-style="normal" text-anchor="middle">L08</text>
<text x="540.0" y="218.0" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="16" fill="#93A6FF" font-weight="normal" font-style="normal" text-anchor="start">-ing 尾巴</text>
<path d="M 430 239 L 478 239" stroke="#93A6FF" stroke-width="1.6"/>
<rect x="480" y="226" width="52" height="26" rx="13" fill="#93A6FF"/>
<text x="506.0" y="244.5" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="15" fill="#0E1217" font-weight="bold" font-style="normal" text-anchor="middle">S01</text>
<text x="540.0" y="245.0" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="16" fill="#93A6FF" font-weight="normal" font-style="normal" text-anchor="start">防御性写作</text>
<path d="M 430 266 L 478 266" stroke="#93A6FF" stroke-width="1.6"/>
<rect x="480" y="253" width="52" height="26" rx="13" fill="#93A6FF"/>
<text x="506.0" y="271.5" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="15" fill="#0E1217" font-weight="bold" font-style="normal" text-anchor="middle">R01</text>
<text x="540.0" y="272.0" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="16" fill="#93A6FF" font-weight="normal" font-style="normal" text-anchor="start">转成审计论文</text>
<path d="M 430 320 L 478 320" stroke="#F07167" stroke-width="1.6"/>
<rect x="480" y="307" width="52" height="26" rx="13" fill="#F07167"/>
<text x="506.0" y="325.5" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="15" fill="#0E1217" font-weight="bold" font-style="normal" text-anchor="middle">R09</text>
<text x="540.0" y="326.0" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="16" fill="#F07167" font-weight="normal" font-style="normal" text-anchor="start">16%？其实是 6.7%</text>
<circle cx="728" cy="82.8" r="14.399999999999999" fill="none" stroke="#93A6FF" stroke-width="2.2" stroke-dasharray="5 4"/><path d="M 699.2 140.39999999999998 Q 699.2 104.4 728 104.4 Q 756.8 104.4 756.8 140.39999999999998" fill="none" stroke="#93A6FF" stroke-width="2.2" stroke-dasharray="5 4" stroke-linecap="round"/>
<text x="782.0" y="116.0" font-family="Georgia, 'Times New Roman', 'Songti SC', 'Noto Serif CJK SC', 'Noto Serif SC', serif" font-size="50" fill="#E5E9EF" font-weight="bold" font-style="normal" text-anchor="start">Absent Author</text>
<text x="700.0" y="180.0" font-family="Georgia, 'Times New Roman', 'Songti SC', 'Noto Serif CJK SC', 'Noto Serif SC', serif" font-size="31" fill="#E5E9EF" font-weight="normal" font-style="normal" text-anchor="start">科研和写作可以自动化，</text>
<text x="700.0" y="220.0" font-family="Georgia, 'Times New Roman', 'Songti SC', 'Noto Serif CJK SC', 'Noto Serif SC', serif" font-size="31" fill="#93A6FF" font-weight="600" font-style="normal" text-anchor="start">署名的责任不能。</text>
<line x1="700" y1="250" x2="1150" y2="250" stroke="#2E3743" stroke-width="1.5"/>
<text x="700.0" y="284.0" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="18" fill="#9AA6B5" font-weight="normal" font-style="normal" text-anchor="start">一份证据清单、两个 agent skill 和一个 lint，</text>
<text x="700.0" y="310.0" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="18" fill="#9AA6B5" font-weight="normal" font-style="normal" text-anchor="start">用来识别没有负责任的人类作者的 AI 论文。</text>
<rect x="700" y="342" width="90" height="34" rx="17.0" fill="#1F2630" stroke="#E5E9EF" stroke-width="1.6"/><text x="745.2" y="364.0" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="14" fill="#E5E9EF" font-weight="bold" font-style="normal" text-anchor="middle">83 条证据</text>
<rect x="800" y="342" width="103" height="34" rx="17.0" fill="#1F2630" stroke="#93A6FF" stroke-width="1.6"/><text x="851.8" y="364.0" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="14" fill="#93A6FF" font-weight="bold" font-style="normal" text-anchor="middle">2 个 skill</text>
<rect x="913" y="342" width="121" height="34" rx="17.0" fill="#1F2630" stroke="#E5E9EF" stroke-width="1.6"/><text x="973.6" y="364.0" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="14" fill="#E5E9EF" font-weight="bold" font-style="normal" text-anchor="middle">校准过的 lint</text>
