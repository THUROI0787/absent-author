<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" role="img" aria-label="Anatomy of a pivot: reviewer score rises while the claim disappears" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Anatomy of a pivot: reviewer score rises while the claim disappears</title>
<rect width="1000" height="540" rx="18" fill="#151A21"/>
<text x="56.0" y="60.0" font-family="Georgia, 'Times New Roman', 'Songti SC', 'Noto Serif CJK SC', 'Noto Serif SC', serif" font-size="32" fill="#E5E9EF" font-weight="bold" font-style="normal" text-anchor="start">Anatomy of a pivot</text>
<text x="56.0" y="92.0" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="16" fill="#9AA6B5" font-weight="normal" font-style="normal" text-anchor="start">Blue: score progression of a real run, quoted from ARIS's README (rounds 1–4). Red: illustrative.</text>
<polyline points="140,160 340,244 540,308 740,339" fill="none" stroke="#F07167" stroke-width="3" stroke-dasharray="8 6"/>
<polyline points="140,308 340,276 540,255 740,202" fill="none" stroke="#93A6FF" stroke-width="4"/>
<circle cx="140" cy="160" r="5.5" fill="#F07167"/>
<circle cx="140" cy="308" r="7.5" fill="#93A6FF" stroke="#151A21" stroke-width="2.5"/>
<text x="140.0" y="337.5" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="17" fill="#93A6FF" font-weight="bold" font-style="normal" text-anchor="middle">6.5/10</text>
<text x="140.0" y="404.0" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="15" fill="#E5E9EF" font-weight="normal" font-style="normal" text-anchor="middle">Added standard metrics,</text>
<text x="140.0" y="425.0" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="15" fill="#E5E9EF" font-weight="normal" font-style="normal" text-anchor="middle">found metric decoupling</text>
<circle cx="340" cy="244" r="5.5" fill="#F07167"/>
<circle cx="340" cy="276" r="7.5" fill="#93A6FF" stroke="#151A21" stroke-width="2.5"/>
<text x="340.0" y="306.0" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="17" fill="#93A6FF" font-weight="bold" font-style="normal" text-anchor="middle">6.8/10</text>
<text x="340.0" y="404.0" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="15" fill="#E5E9EF" font-weight="normal" font-style="normal" text-anchor="middle">Key claim failed to</text>
<text x="340.0" y="425.0" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="15" fill="#E5E9EF" font-weight="normal" font-style="normal" text-anchor="middle">reproduce; pivoted narrative</text>
<circle cx="540" cy="308" r="5.5" fill="#F07167"/>
<circle cx="540" cy="255" r="7.5" fill="#93A6FF" stroke="#151A21" stroke-width="2.5"/>
<text x="540.0" y="239.0" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="17" fill="#93A6FF" font-weight="bold" font-style="normal" text-anchor="middle">7.0/10</text>
<text x="540.0" y="404.0" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="15" fill="#E5E9EF" font-weight="normal" font-style="normal" text-anchor="middle">Large seed study killed</text>
<text x="540.0" y="425.0" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="15" fill="#E5E9EF" font-weight="normal" font-style="normal" text-anchor="middle">main improvement claim</text>
<circle cx="740" cy="339" r="5.5" fill="#F07167"/>
<circle cx="740" cy="202" r="7.5" fill="#93A6FF" stroke="#151A21" stroke-width="2.5"/>
<text x="740.0" y="186.5" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="17" fill="#93A6FF" font-weight="bold" font-style="normal" text-anchor="middle">7.5/10</text>
<text x="740.0" y="404.0" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="15" fill="#E5E9EF" font-weight="normal" font-style="normal" text-anchor="middle">Diagnostic evidence</text>
<text x="740.0" y="425.0" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="15" fill="#E5E9EF" font-weight="normal" font-style="normal" text-anchor="middle">solidified; submission ready</text>
<line x1="80" y1="374" x2="810" y2="374" stroke="#2E3743" stroke-width="1.5"/>
<text x="830.0" y="208.5" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="16" fill="#93A6FF" font-weight="bold" font-style="normal" text-anchor="start">LLM-reviewer score</text>
<text x="830.0" y="345.0" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="16" fill="#F07167" font-weight="bold" font-style="normal" text-anchor="start">original claim</text>
<text x="830.0" y="367.0" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="15" fill="#F07167" font-weight="normal" font-style="normal" text-anchor="start">(illustrative)</text>
<text x="56.0" y="480.0" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="16.5" fill="#E5E9EF" font-weight="normal" font-style="normal" text-anchor="start">The score rises while the original claim disappears. A reader later sees evidence item R01:</text>
<text x="56.0" y="506.0" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="16.5" fill="#E5E9EF" font-weight="normal" font-style="normal" text-anchor="start">a diagnostic framing on top of a leftover method skeleton.</text>
</svg>
