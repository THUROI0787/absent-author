<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" role="img" aria-label="Evidence layers and what each may count toward" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Evidence layers and what each may count toward</title>
<rect width="1000" height="600" rx="18" fill="#E9EDF1"/>
<text x="56.0" y="62.0" font-family="Georgia, 'Times New Roman', 'Songti SC', 'Noto Serif CJK SC', 'Noto Serif SC', serif" font-size="32" fill="#1D2430" font-weight="bold" font-style="normal" text-anchor="start">Four layers, and what each may prove</text>
<text x="56.0" y="94.0" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="17" fill="#5B6675" font-weight="normal" font-style="normal" text-anchor="start">The easier a trace is to scrub, the less it is allowed to prove.</text>
<text x="560.0" y="132.0" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="14" fill="#5B6675" font-weight="bold" font-style="normal" text-anchor="start">how easy to scrub</text>
<text x="944.0" y="132.0" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="14" fill="#5B6675" font-weight="bold" font-style="normal" text-anchor="end">counts toward</text>
<rect x="56" y="146" width="888" height="82" rx="12" fill="#FFFFFF" stroke="#D5DBE2"/>
<text x="92.0" y="202.0" font-family="Georgia, 'Times New Roman', 'Songti SC', 'Noto Serif CJK SC', 'Noto Serif SC', serif" font-size="44" fill="#2747C7" font-weight="bold" font-style="normal" text-anchor="middle">L</text>
<text x="132.0" y="182.0" font-family="Georgia, 'Times New Roman', 'Songti SC', 'Noto Serif CJK SC', 'Noto Serif SC', serif" font-size="22" fill="#1D2430" font-weight="bold" font-style="normal" text-anchor="start">Language</text>
<text x="132.0" y="208.0" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="16.5" fill="#5B6675" font-weight="normal" font-style="normal" text-anchor="start">words, punctuation, sentence moulds</text>
<text x="560.0" y="176.0" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="14.5" fill="#5B6675" font-weight="bold" font-style="normal" text-anchor="start">16 items</text>
<rect x="560" y="186" width="190" height="11" rx="5.5" fill="#EEF1F4"/>
<rect x="560" y="186" width="175" height="11" rx="5.5" fill="#FFE45C" stroke="#C8B23A" stroke-width="0.8"/>
<text x="560.0" y="218.0" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="14.5" fill="#5B6675" font-weight="normal" font-style="normal" text-anchor="start">trivial to scrub</text>
<g transform="translate(842,170)"><rect x="0" y="0" width="82" height="34" rx="17.0" fill="#FFFFFF" stroke="#2747C7" stroke-width="1.6"/><text x="41.1" y="22.4" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="15" fill="#2747C7" font-weight="bold" font-style="normal" text-anchor="middle">W only</text></g>
<rect x="56" y="242" width="888" height="82" rx="12" fill="#FFFFFF" stroke="#D5DBE2"/>
<text x="92.0" y="298.0" font-family="Georgia, 'Times New Roman', 'Songti SC', 'Noto Serif CJK SC', 'Noto Serif SC', serif" font-size="44" fill="#2747C7" font-weight="bold" font-style="normal" text-anchor="middle">S</text>
<text x="132.0" y="278.0" font-family="Georgia, 'Times New Roman', 'Songti SC', 'Noto Serif CJK SC', 'Noto Serif SC', serif" font-size="22" fill="#1D2430" font-weight="bold" font-style="normal" text-anchor="start">Structure</text>
<text x="132.0" y="304.0" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="16.5" fill="#5B6675" font-weight="normal" font-style="normal" text-anchor="start">caveats, coined terms, narrative</text>
<text x="560.0" y="272.0" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="14.5" fill="#5B6675" font-weight="bold" font-style="normal" text-anchor="start">18 items</text>
<rect x="560" y="282" width="190" height="11" rx="5.5" fill="#EEF1F4"/>
<rect x="560" y="282" width="118" height="11" rx="5.5" fill="#FFE45C" stroke="#C8B23A" stroke-width="0.8"/>
<text x="560.0" y="314.0" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="14.5" fill="#5B6675" font-weight="normal" font-style="normal" text-anchor="start">takes rewriting</text>
<g transform="translate(842,266)"><rect x="0" y="0" width="82" height="34" rx="17.0" fill="#FFFFFF" stroke="#2747C7" stroke-width="1.6"/><text x="41.1" y="22.4" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="15" fill="#2747C7" font-weight="bold" font-style="normal" text-anchor="middle">W or R</text></g>
<rect x="56" y="338" width="888" height="82" rx="12" fill="#FFFFFF" stroke="#D5DBE2"/>
<text x="92.0" y="394.0" font-family="Georgia, 'Times New Roman', 'Songti SC', 'Noto Serif CJK SC', 'Noto Serif SC', serif" font-size="44" fill="#2747C7" font-weight="bold" font-style="normal" text-anchor="middle">R</text>
<text x="132.0" y="374.0" font-family="Georgia, 'Times New Roman', 'Songti SC', 'Noto Serif CJK SC', 'Noto Serif SC', serif" font-size="22" fill="#1D2430" font-weight="bold" font-style="normal" text-anchor="start">Research</text>
<text x="132.0" y="400.0" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="16.5" fill="#5B6675" font-weight="normal" font-style="normal" text-anchor="start">pivots, scale vs. claims, numbers</text>
<text x="560.0" y="368.0" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="14.5" fill="#5B6675" font-weight="bold" font-style="normal" text-anchor="start">22 items</text>
<rect x="560" y="378" width="190" height="11" rx="5.5" fill="#EEF1F4"/>
<rect x="560" y="378" width="57" height="11" rx="5.5" fill="#FFE45C" stroke="#C8B23A" stroke-width="0.8"/>
<text x="560.0" y="410.0" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="14.5" fill="#5B6675" font-weight="normal" font-style="normal" text-anchor="start">takes real research</text>
<g transform="translate(885,362)"><rect x="0" y="0" width="39" height="34" rx="17.0" fill="#FFFFFF" stroke="#1D2430" stroke-width="1.6"/><text x="19.4" y="22.4" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="15" fill="#1D2430" font-weight="bold" font-style="normal" text-anchor="middle">R</text></g>
<rect x="56" y="434" width="888" height="82" rx="12" fill="#FFFFFF" stroke="#D5DBE2"/>
<text x="92.0" y="490.0" font-family="Georgia, 'Times New Roman', 'Songti SC', 'Noto Serif CJK SC', 'Noto Serif SC', serif" font-size="44" fill="#2747C7" font-weight="bold" font-style="normal" text-anchor="middle">P</text>
<text x="132.0" y="470.0" font-family="Georgia, 'Times New Roman', 'Songti SC', 'Noto Serif CJK SC', 'Noto Serif SC', serif" font-size="22" fill="#1D2430" font-weight="bold" font-style="normal" text-anchor="start">Artifacts</text>
<text x="132.0" y="496.0" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="16.5" fill="#5B6675" font-weight="normal" font-style="normal" text-anchor="start">references, residue, code, rebuttal</text>
<text x="560.0" y="464.0" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="14.5" fill="#5B6675" font-weight="bold" font-style="normal" text-anchor="start">18 items</text>
<rect x="560" y="474" width="190" height="11" rx="5.5" fill="#EEF1F4"/>
<rect x="560" y="474" width="34" height="11" rx="5.5" fill="#FFE45C" stroke="#C8B23A" stroke-width="0.8"/>
<text x="560.0" y="506.0" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="14.5" fill="#5B6675" font-weight="normal" font-style="normal" text-anchor="start">one slip is enough</text>
<g transform="translate(816,458)"><rect x="0" y="0" width="108" height="34" rx="17.0" fill="#FFFFFF" stroke="#C4362E" stroke-width="1.6"/><text x="54.2" y="22.4" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="15" fill="#C4362E" font-weight="bold" font-style="normal" text-anchor="middle">R or flag</text></g>
<text x="56.0" y="548.0" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="15.5" fill="#5B6675" font-weight="normal" font-style="normal" text-anchor="start">Plus 9 H items, signs of a present author. Prose-only H can soften a ★★ finding;</text>
<text x="56.0" y="572.0" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="15.5" fill="#5B6675" font-weight="normal" font-style="normal" text-anchor="start">artifacts (logs, code, pre-registration) can cancel one. Nothing cancels a verified flag.</text>
</svg>
