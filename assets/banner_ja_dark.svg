<text x="540.0" y="245.0" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="16" fill="#93A6FF" font-weight="normal" font-style="normal" text-anchor="start">防御的な書き方</text>
<path d="M 430 266 L 478 266" stroke="#93A6FF" stroke-width="1.6"/>
<rect x="480" y="253" width="52" height="26" rx="13" fill="#93A6FF"/>
<text x="506.0" y="271.5" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="15" fill="#0E1217" font-weight="bold" font-style="normal" text-anchor="middle">R01</text>
<text x="540.0" y="272.0" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="16" fill="#93A6FF" font-weight="normal" font-style="normal" text-anchor="start">「監査」への転換</text>
<path d="M 430 320 L 478 320" stroke="#F07167" stroke-width="1.6"/>
<rect x="480" y="307" width="52" height="26" rx="13" fill="#F07167"/>
<text x="506.0" y="325.5" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="15" fill="#0E1217" font-weight="bold" font-style="normal" text-anchor="middle">R09</text>
<text x="540.0" y="326.0" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="16" fill="#F07167" font-weight="normal" font-style="normal" text-anchor="start">16%？ 実は 6.7%</text>
<circle cx="728" cy="82.8" r="14.399999999999999" fill="none" stroke="#93A6FF" stroke-width="2.2" stroke-dasharray="5 4"/><path d="M 699.2 140.39999999999998 Q 699.2 104.4 728 104.4 Q 756.8 104.4 756.8 140.39999999999998" fill="none" stroke="#93A6FF" stroke-width="2.2" stroke-dasharray="5 4" stroke-linecap="round"/>
<text x="782.0" y="116.0" font-family="Georgia, 'Times New Roman', 'Songti SC', 'Noto Serif CJK SC', 'Noto Serif SC', serif" font-size="50" fill="#E5E9EF" font-weight="bold" font-style="normal" text-anchor="start">Absent Author</text>
<text x="700.0" y="180.0" font-family="Georgia, 'Hiragino Mincho ProN', 'Yu Mincho', 'Noto Serif CJK JP', 'Noto Serif JP', serif" font-size="29" fill="#E5E9EF" font-weight="normal" font-style="normal" text-anchor="start">研究も執筆も、自動化できる。</text>
<text x="700.0" y="220.0" font-family="Georgia, 'Hiragino Mincho ProN', 'Yu Mincho', 'Noto Serif CJK JP', 'Noto Serif JP', serif" font-size="29" fill="#93A6FF" font-weight="600" font-style="normal" text-anchor="start">著者の責任は、自動化できない。</text>
<line x1="700" y1="250" x2="1150" y2="250" stroke="#2E3743" stroke-width="1.5"/>
<text x="700.0" y="284.0" font-family="'Helvetica Neue', Helvetica, Arial, 'Hiragino Sans', 'Yu Gothic', 'Noto Sans CJK JP', sans-serif" font-size="18" fill="#9AA6B5" font-weight="normal" font-style="normal" text-anchor="start">著者が不在の AI 論文を見分けるための、</text>
<text x="700.0" y="310.0" font-family="'Helvetica Neue', Helvetica, Arial, 'Hiragino Sans', 'Yu Gothic', 'Noto Sans CJK JP', sans-serif" font-size="18" fill="#9AA6B5" font-weight="normal" font-style="normal" text-anchor="start">証拠リスト、2つのエージェント用スキル、lint。</text>
