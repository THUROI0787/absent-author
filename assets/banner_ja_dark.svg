<rect x="828" y="342" width="102" height="34" rx="17.0" fill="#1F2630" stroke="#93A6FF" stroke-width="1.6"/><text x="879.4" y="364.0" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="14" fill="#93A6FF" font-weight="bold" font-style="normal" text-anchor="middle">2つのスキル</text>
<rect x="940" y="342" width="135" height="34" rx="17.0" fill="#1F2630" stroke="#E5E9EF" stroke-width="1.6"/><text x="1007.8" y="364.0" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="14" fill="#E5E9EF" font-weight="bold" font-style="normal" text-anchor="middle">較正済みの lint</text>
