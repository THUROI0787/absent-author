<text x="540.0" y="218.0" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="16" fill="#93A6FF" font-weight="normal" font-style="normal" text-anchor="start">-ing の文末</text>
<path d="M 430 239 L 478 239" stroke="#93A6FF" stroke-width="1.6"/>
<rect x="480" y="226" width="52" height="26" rx="13" fill="#93A6FF"/>
