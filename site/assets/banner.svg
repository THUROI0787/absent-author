<text x="540.0" y="326.0" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="16" fill="#C4362E" font-weight="normal" font-style="normal" text-anchor="start">16%? It is 6.7%</text>
