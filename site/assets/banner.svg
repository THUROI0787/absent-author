<text x="74.0" y="217.0" font-family="Georgia, 'Times New Roman', 'Songti SC', 'Noto Serif CJK SC', 'Noto Serif SC', serif" font-size="15.5" fill="#1D2430" font-weight="normal" font-style="normal" text-anchor="start">highlighting the need for robustness.</text>
