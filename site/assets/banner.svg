<text x="700.0" y="220.0" font-family="Georgia, 'Times New Roman', 'Songti SC', 'Noto Serif CJK SC', 'Noto Serif SC', serif" font-size="27" fill="#2747C7" font-weight="600" font-style="normal" text-anchor="start">Authorship cannot.</text>
