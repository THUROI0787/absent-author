<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" role="img" aria-label="Evidence layers and what each may count toward" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Evidence layers and what each may count toward</title>
<rect width="1000" height="600" rx="18" fill="#151A21"/>
<text x="56.0" y="62.0" font-family="Georgia, 'Times New Roman', 'Songti SC', 'Noto Serif CJK SC', 'Noto Serif SC', serif" font-size="32" fill="#E5E9EF" font-weight="bold" font-style="normal" text-anchor="start">四层证据，各自能证明什么</text>
<text x="56.0" y="94.0" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="17" fill="#9AA6B5" font-weight="normal" font-style="normal" text-anchor="start">痕迹越容易被洗掉，它能证明的就越少。</text>
<text x="560.0" y="132.0" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="14" fill="#9AA6B5" font-weight="bold" font-style="normal" text-anchor="start">多容易洗掉</text>
<text x="944.0" y="132.0" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="14" fill="#9AA6B5" font-weight="bold" font-style="normal" text-anchor="end">计入</text>
<rect x="56" y="146" width="888" height="82" rx="12" fill="#1F2630" stroke="#2E3743"/>
<text x="92.0" y="202.0" font-family="Georgia, 'Times New Roman', 'Songti SC', 'Noto Serif CJK SC', 'Noto Serif SC', serif" font-size="44" fill="#93A6FF" font-weight="bold" font-style="normal" text-anchor="middle">L</text>
<text x="132.0" y="182.0" font-family="Georgia, 'Times New Roman', 'Songti SC', 'Noto Serif CJK SC', 'Noto Serif SC', serif" font-size="22" fill="#E5E9EF" font-weight="bold" font-style="normal" text-anchor="start">语言</text>
<text x="132.0" y="208.0" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="16.5" fill="#9AA6B5" font-weight="normal" font-style="normal" text-anchor="start">词语、标点、句式模板</text>
<text x="560.0" y="176.0" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="14.5" fill="#9AA6B5" font-weight="bold" font-style="normal" text-anchor="start">16 条</text>
<rect x="560" y="186" width="190" height="11" rx="5.5" fill="#2A323D"/>
<rect x="560" y="186" width="175" height="11" rx="5.5" fill="#FFE45C" stroke="#C8B23A" stroke-width="0.8"/>
<text x="560.0" y="218.0" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="14.5" fill="#9AA6B5" font-weight="normal" font-style="normal" text-anchor="start">一洗就掉</text>
<g transform="translate(847,170)"><rect x="0" y="0" width="77" height="34" rx="17.0" fill="#1F2630" stroke="#93A6FF" stroke-width="1.6"/><text x="38.7" y="22.4" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="15" fill="#93A6FF" font-weight="bold" font-style="normal" text-anchor="middle">只计 W</text></g>
<rect x="56" y="242" width="888" height="82" rx="12" fill="#1F2630" stroke="#2E3743"/>
<text x="92.0" y="298.0" font-family="Georgia, 'Times New Roman', 'Songti SC', 'Noto Serif CJK SC', 'Noto Serif SC', serif" font-size="44" fill="#93A6FF" font-weight="bold" font-style="normal" text-anchor="middle">S</text>
<text x="132.0" y="278.0" font-family="Georgia, 'Times New Roman', 'Songti SC', 'Noto Serif CJK SC', 'Noto Serif SC', serif" font-size="22" fill="#E5E9EF" font-weight="bold" font-style="normal" text-anchor="start">结构</text>
<text x="132.0" y="304.0" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="16.5" fill="#9AA6B5" font-weight="normal" font-style="normal" text-anchor="start">caveat、生造词、叙事</text>
<text x="560.0" y="272.0" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="14.5" fill="#9AA6B5" font-weight="bold" font-style="normal" text-anchor="start">18 条</text>
<rect x="560" y="282" width="190" height="11" rx="5.5" fill="#2A323D"/>
<rect x="560" y="282" width="118" height="11" rx="5.5" fill="#FFE45C" stroke="#C8B23A" stroke-width="0.8"/>
<text x="560.0" y="314.0" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="14.5" fill="#9AA6B5" font-weight="normal" font-style="normal" text-anchor="start">要重写才能去掉</text>
<g transform="translate(844,266)"><rect x="0" y="0" width="80" height="34" rx="17.0" fill="#1F2630" stroke="#93A6FF" stroke-width="1.6"/><text x="39.9" y="22.4" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="15" fill="#93A6FF" font-weight="bold" font-style="normal" text-anchor="middle">W 或 R</text></g>
<rect x="56" y="338" width="888" height="82" rx="12" fill="#1F2630" stroke="#2E3743"/>
<text x="92.0" y="394.0" font-family="Georgia, 'Times New Roman', 'Songti SC', 'Noto Serif CJK SC', 'Noto Serif SC', serif" font-size="44" fill="#93A6FF" font-weight="bold" font-style="normal" text-anchor="middle">R</text>
<text x="132.0" y="374.0" font-family="Georgia, 'Times New Roman', 'Songti SC', 'Noto Serif CJK SC', 'Noto Serif SC', serif" font-size="22" fill="#E5E9EF" font-weight="bold" font-style="normal" text-anchor="start">研究</text>
<text x="132.0" y="400.0" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="16.5" fill="#9AA6B5" font-weight="normal" font-style="normal" text-anchor="start">转向、规模与结论、数字</text>
<text x="560.0" y="368.0" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="14.5" fill="#9AA6B5" font-weight="bold" font-style="normal" text-anchor="start">22 条</text>
<rect x="560" y="378" width="190" height="11" rx="5.5" fill="#2A323D"/>
<rect x="560" y="378" width="57" height="11" rx="5.5" fill="#FFE45C" stroke="#C8B23A" stroke-width="0.8"/>
<text x="560.0" y="410.0" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="14.5" fill="#9AA6B5" font-weight="normal" font-style="normal" text-anchor="start">要真做研究</text>
<g transform="translate(885,362)"><rect x="0" y="0" width="39" height="34" rx="17.0" fill="#1F2630" stroke="#E5E9EF" stroke-width="1.6"/><text x="19.4" y="22.4" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="15" fill="#E5E9EF" font-weight="bold" font-style="normal" text-anchor="middle">R</text></g>
<rect x="56" y="434" width="888" height="82" rx="12" fill="#1F2630" stroke="#2E3743"/>
<text x="92.0" y="490.0" font-family="Georgia, 'Times New Roman', 'Songti SC', 'Noto Serif CJK SC', 'Noto Serif SC', serif" font-size="44" fill="#93A6FF" font-weight="bold" font-style="normal" text-anchor="middle">P</text>
<text x="132.0" y="470.0" font-family="Georgia, 'Times New Roman', 'Songti SC', 'Noto Serif CJK SC', 'Noto Serif SC', serif" font-size="22" fill="#E5E9EF" font-weight="bold" font-style="normal" text-anchor="start">产物</text>
<text x="132.0" y="496.0" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="16.5" fill="#9AA6B5" font-weight="normal" font-style="normal" text-anchor="start">引用、残留、代码、rebuttal</text>
<text x="560.0" y="464.0" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="14.5" fill="#9AA6B5" font-weight="bold" font-style="normal" text-anchor="start">18 条</text>
<rect x="560" y="474" width="190" height="11" rx="5.5" fill="#2A323D"/>
<rect x="560" y="474" width="34" height="11" rx="5.5" fill="#FFE45C" stroke="#C8B23A" stroke-width="0.8"/>
<text x="560.0" y="506.0" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="14.5" fill="#9AA6B5" font-weight="normal" font-style="normal" text-anchor="start">一次疏忽就够</text>
<g transform="translate(832,458)"><rect x="0" y="0" width="92" height="34" rx="17.0" fill="#1F2630" stroke="#F07167" stroke-width="1.6"/><text x="46.2" y="22.4" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="15" fill="#F07167" font-weight="bold" font-style="normal" text-anchor="middle">R 或标记</text></g>
<text x="56.0" y="548.0" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="15.5" fill="#9AA6B5" font-weight="normal" font-style="normal" text-anchor="start">另有 9 条 H：作者在场的迹象。纯文字的 H 能把一条 ★★ 降一级；</text>
<text x="56.0" y="572.0" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="15.5" fill="#9AA6B5" font-weight="normal" font-style="normal" text-anchor="start">产物（日志、代码、预注册）可以抵消一条发现。已核实的标记无法抵消。</text>
</svg>
