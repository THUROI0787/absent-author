<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" width="1000" height="720" role="img" aria-label="Quadrant chart: writing axis W by research axis R" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Quadrant chart: writing axis W by research axis R</title>
<rect width="1000" height="720" rx="18" fill="#151A21"/>
<text x="56.0" y="62.0" font-family="Georgia, 'Times New Roman', 'Songti SC', 'Noto Serif CJK SC', 'Noto Serif SC', serif" font-size="32" fill="#E5E9EF" font-weight="bold" font-style="normal" text-anchor="start">两个问题，四种论文</text>
<text x="56.0" y="94.0" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="16.5" fill="#9AA6B5" font-weight="normal" font-style="normal" text-anchor="start">W：写作是否由 AI 主导、无人打磨？   R：研究是否无人引导、无人核查？</text>
<rect x="150" y="146" width="392" height="220" rx="14" fill="#1F2630" stroke="#4FC08D" stroke-width="2"/>
<rect x="150" y="146" width="10" height="220" rx="5" fill="#4FC08D"/>
<text x="182.0" y="206.0" font-family="Georgia, 'Times New Roman', 'Songti SC', 'Noto Serif CJK SC', 'Noto Serif SC', serif" font-size="48" fill="#4FC08D" font-weight="bold" font-style="normal" text-anchor="start">A</text>
<text x="232.0" y="198.0" font-family="Georgia, 'Times New Roman', 'Songti SC', 'Noto Serif CJK SC', 'Noto Serif SC', serif" font-size="23" fill="#E5E9EF" font-weight="bold" font-style="normal" text-anchor="start">正常的 AI 辅助工作</text>
<text x="182.0" y="250.0" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="17" fill="#E5E9EF" font-weight="normal" font-style="normal" text-anchor="start">像审任何论文一样审。</text>
<text x="182.0" y="276.0" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="17" fill="#E5E9EF" font-weight="normal" font-style="normal" text-anchor="start">用了 AI 不是问题。</text>
<rect x="556" y="146" width="392" height="220" rx="14" fill="#1F2630" stroke="#A68BFF" stroke-width="2"/>
<rect x="556" y="146" width="10" height="220" rx="5" fill="#A68BFF"/>
<text x="588.0" y="206.0" font-family="Georgia, 'Times New Roman', 'Songti SC', 'Noto Serif CJK SC', 'Noto Serif SC', serif" font-size="48" fill="#A68BFF" font-weight="bold" font-style="normal" text-anchor="start">C</text>
<text x="638.0" y="198.0" font-family="Georgia, 'Times New Roman', 'Songti SC', 'Noto Serif CJK SC', 'Noto Serif SC', serif" font-size="23" fill="#E5E9EF" font-weight="bold" font-style="normal" text-anchor="start">镀金空壳</text>
<text x="588.0" y="250.0" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="17" fill="#E5E9EF" font-weight="normal" font-style="normal" text-anchor="start">文字干净，研究没人核查。</text>
<text x="588.0" y="276.0" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="17" fill="#E5E9EF" font-weight="normal" font-style="normal" text-anchor="start">按实质审；</text>
<text x="588.0" y="302.0" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="17" fill="#E5E9EF" font-weight="normal" font-style="normal" text-anchor="start">请 AC 要求日志或代码。</text>
<rect x="150" y="380" width="392" height="220" rx="14" fill="#1F2630" stroke="#E0A040" stroke-width="2"/>
<rect x="150" y="380" width="10" height="220" rx="5" fill="#E0A040"/>
<text x="182.0" y="440.0" font-family="Georgia, 'Times New Roman', 'Songti SC', 'Noto Serif CJK SC', 'Noto Serif SC', serif" font-size="48" fill="#E0A040" font-weight="bold" font-style="normal" text-anchor="start">B</text>
<text x="232.0" y="432.0" font-family="Georgia, 'Times New Roman', 'Songti SC', 'Noto Serif CJK SC', 'Noto Serif SC', serif" font-size="23" fill="#E5E9EF" font-weight="bold" font-style="normal" text-anchor="start">可以挽救</text>
<text x="182.0" y="484.0" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="17" fill="#E5E9EF" font-weight="normal" font-style="normal" text-anchor="start">贡献真实，写作 AI 主导。</text>
<text x="182.0" y="510.0" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="17" fill="#E5E9EF" font-weight="normal" font-style="normal" text-anchor="start">给出具体的重写清单；</text>
<text x="182.0" y="536.0" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="17" fill="#E5E9EF" font-weight="normal" font-style="normal" text-anchor="start">不因写作单独拒稿。</text>
<rect x="556" y="380" width="392" height="220" rx="14" fill="#1F2630" stroke="#F07167" stroke-width="2"/>
<rect x="556" y="380" width="10" height="220" rx="5" fill="#F07167"/>
<text x="588.0" y="440.0" font-family="Georgia, 'Times New Roman', 'Songti SC', 'Noto Serif CJK SC', 'Noto Serif SC', serif" font-size="48" fill="#F07167" font-weight="bold" font-style="normal" text-anchor="start">D</text>
<text x="638.0" y="432.0" font-family="Georgia, 'Times New Roman', 'Songti SC', 'Noto Serif CJK SC', 'Noto Serif SC', serif" font-size="23" fill="#E5E9EF" font-weight="bold" font-style="normal" text-anchor="start">AI waste</text>
<text x="588.0" y="484.0" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="17" fill="#E5E9EF" font-weight="normal" font-style="normal" text-anchor="start">以可核实的缺陷拒稿。</text>
<text x="588.0" y="510.0" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="17" fill="#E5E9EF" font-weight="normal" font-style="normal" text-anchor="start">证据作为问题交给 AC；</text>
<text x="588.0" y="536.0" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="17" fill="#E5E9EF" font-weight="normal" font-style="normal" text-anchor="start">有标记时按会议政策处理。</text>
<text x="346.0" y="132.0" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="15" fill="#9AA6B5" font-weight="bold" font-style="normal" text-anchor="middle">R0–R1  研究有人引导</text>
<text x="752.0" y="132.0" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="15" fill="#9AA6B5" font-weight="bold" font-style="normal" text-anchor="middle">R2–R3  引导或核查缺席</text>
<text x="130.0" y="256.0" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="15" fill="#9AA6B5" font-weight="bold" font-style="normal" text-anchor="end">W0–W1</text>
<text x="130.0" y="276.0" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="14" fill="#9AA6B5" font-weight="normal" font-style="normal" text-anchor="end">有人打磨</text>
<text x="130.0" y="490.0" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="15" fill="#9AA6B5" font-weight="bold" font-style="normal" text-anchor="end">W2–W3</text>
<text x="130.0" y="510.0" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="14" fill="#9AA6B5" font-weight="normal" font-style="normal" text-anchor="end">AI 主导</text>
<circle cx="479" cy="186" r="7" fill="#E5E9EF" stroke="#1F2630" stroke-width="2"/>
<circle cx="503" cy="186" r="7" fill="#E5E9EF" stroke="#1F2630" stroke-width="2"/>
<circle cx="909" cy="186" r="7" fill="#E5E9EF" stroke="#1F2630" stroke-width="2"/>
<circle cx="862" cy="420" r="7" fill="#E5E9EF" stroke="#1F2630" stroke-width="2"/>
<circle cx="885" cy="420" r="7" fill="#E5E9EF" stroke="#1F2630" stroke-width="2"/>
<circle cx="909" cy="420" r="7" fill="#E5E9EF" stroke="#1F2630" stroke-width="2"/>
<text x="56.0" y="644.0" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="15" fill="#9AA6B5" font-weight="normal" font-style="normal" text-anchor="start">圆点：6 篇论文的盲测，标签事后揭晓（2 篇人类论文 → A，1 篇管线论文 → C，3 篇 AI 论文 → D）。</text>
<text x="56.0" y="670.0" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="15" fill="#E5E9EF" font-weight="bold" font-style="normal" text-anchor="start">B 和 D 只由研究轴区分。普通的质量问题记在单独的 Q 轴。</text>
</svg>
