<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" width="1000" height="720" role="img" aria-label="Quadrant chart: writing axis W by research axis R" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Quadrant chart: writing axis W by research axis R</title>
<rect width="1000" height="720" rx="18" fill="#E9EDF1"/>
<text x="56.0" y="62.0" font-family="Georgia, 'Times New Roman', 'Songti SC', 'Noto Serif CJK SC', 'Noto Serif SC', serif" font-size="32" fill="#1D2430" font-weight="bold" font-style="normal" text-anchor="start">Two questions, four kinds of paper</text>
<text x="56.0" y="94.0" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="16.5" fill="#5B6675" font-weight="normal" font-style="normal" text-anchor="start">W: was the writing left AI-led and unpolished?   R: was the research left unsteered and unchecked?</text>
<rect x="150" y="146" width="392" height="220" rx="14" fill="#FFFFFF" stroke="#2F8F6B" stroke-width="2"/>
<rect x="150" y="146" width="10" height="220" rx="5" fill="#2F8F6B"/>
<text x="182.0" y="206.0" font-family="Georgia, 'Times New Roman', 'Songti SC', 'Noto Serif CJK SC', 'Noto Serif SC', serif" font-size="48" fill="#2F8F6B" font-weight="bold" font-style="normal" text-anchor="start">A</text>
<text x="232.0" y="198.0" font-family="Georgia, 'Times New Roman', 'Songti SC', 'Noto Serif CJK SC', 'Noto Serif SC', serif" font-size="23" fill="#1D2430" font-weight="bold" font-style="normal" text-anchor="start">Normal AI-assisted work</text>
<text x="182.0" y="250.0" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="17" fill="#1D2430" font-weight="normal" font-style="normal" text-anchor="start">Review it like any paper.</text>
<text x="182.0" y="276.0" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="17" fill="#1D2430" font-weight="normal" font-style="normal" text-anchor="start">Using AI is not the problem.</text>
<rect x="556" y="146" width="392" height="220" rx="14" fill="#FFFFFF" stroke="#6A4BC4" stroke-width="2"/>
<rect x="556" y="146" width="10" height="220" rx="5" fill="#6A4BC4"/>
<text x="588.0" y="206.0" font-family="Georgia, 'Times New Roman', 'Songti SC', 'Noto Serif CJK SC', 'Noto Serif SC', serif" font-size="48" fill="#6A4BC4" font-weight="bold" font-style="normal" text-anchor="start">C</text>
<text x="638.0" y="198.0" font-family="Georgia, 'Times New Roman', 'Songti SC', 'Noto Serif CJK SC', 'Noto Serif SC', serif" font-size="23" fill="#1D2430" font-weight="bold" font-style="normal" text-anchor="start">Veneer</text>
<text x="588.0" y="250.0" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="17" fill="#1D2430" font-weight="normal" font-style="normal" text-anchor="start">Clean prose, unchecked research.</text>
<text x="588.0" y="276.0" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="17" fill="#1D2430" font-weight="normal" font-style="normal" text-anchor="start">Review the substance;</text>
<text x="588.0" y="302.0" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="17" fill="#1D2430" font-weight="normal" font-style="normal" text-anchor="start">ask the AC for logs or code.</text>
<rect x="150" y="380" width="392" height="220" rx="14" fill="#FFFFFF" stroke="#B7791F" stroke-width="2"/>
<rect x="150" y="380" width="10" height="220" rx="5" fill="#B7791F"/>
<text x="182.0" y="440.0" font-family="Georgia, 'Times New Roman', 'Songti SC', 'Noto Serif CJK SC', 'Noto Serif SC', serif" font-size="48" fill="#B7791F" font-weight="bold" font-style="normal" text-anchor="start">B</text>
<text x="232.0" y="432.0" font-family="Georgia, 'Times New Roman', 'Songti SC', 'Noto Serif CJK SC', 'Noto Serif SC', serif" font-size="23" fill="#1D2430" font-weight="bold" font-style="normal" text-anchor="start">Salvageable</text>
<text x="182.0" y="484.0" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="17" fill="#1D2430" font-weight="normal" font-style="normal" text-anchor="start">Real contribution, AI-led prose.</text>
<text x="182.0" y="510.0" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="17" fill="#1D2430" font-weight="normal" font-style="normal" text-anchor="start">Give a concrete rewrite list;</text>
<text x="182.0" y="536.0" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="17" fill="#1D2430" font-weight="normal" font-style="normal" text-anchor="start">don't reject on writing alone.</text>
<rect x="556" y="380" width="392" height="220" rx="14" fill="#FFFFFF" stroke="#C4362E" stroke-width="2"/>
<rect x="556" y="380" width="10" height="220" rx="5" fill="#C4362E"/>
<text x="588.0" y="440.0" font-family="Georgia, 'Times New Roman', 'Songti SC', 'Noto Serif CJK SC', 'Noto Serif SC', serif" font-size="48" fill="#C4362E" font-weight="bold" font-style="normal" text-anchor="start">D</text>
<text x="638.0" y="432.0" font-family="Georgia, 'Times New Roman', 'Songti SC', 'Noto Serif CJK SC', 'Noto Serif SC', serif" font-size="23" fill="#1D2430" font-weight="bold" font-style="normal" text-anchor="start">AI waste</text>
<text x="588.0" y="484.0" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="17" fill="#1D2430" font-weight="normal" font-style="normal" text-anchor="start">Reject on verifiable defects.</text>
<text x="588.0" y="510.0" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="17" fill="#1D2430" font-weight="normal" font-style="normal" text-anchor="start">Evidence to the AC as questions;</text>
<text x="588.0" y="536.0" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="17" fill="#1D2430" font-weight="normal" font-style="normal" text-anchor="start">venue policy for any flag.</text>
<text x="346.0" y="132.0" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="15" fill="#5B6675" font-weight="bold" font-style="normal" text-anchor="middle">R0–R1  research steered</text>
<text x="752.0" y="132.0" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="15" fill="#5B6675" font-weight="bold" font-style="normal" text-anchor="middle">R2–R3  steering or checking absent</text>
<text x="130.0" y="256.0" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="15" fill="#5B6675" font-weight="bold" font-style="normal" text-anchor="end">W0–W1</text>
<text x="130.0" y="276.0" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="14" fill="#5B6675" font-weight="normal" font-style="normal" text-anchor="end">polished</text>
<text x="130.0" y="490.0" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="15" fill="#5B6675" font-weight="bold" font-style="normal" text-anchor="end">W2–W3</text>
<text x="130.0" y="510.0" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="14" fill="#5B6675" font-weight="normal" font-style="normal" text-anchor="end">AI-led</text>
<circle cx="479" cy="186" r="7" fill="#1D2430" stroke="#FFFFFF" stroke-width="2"/>
<circle cx="503" cy="186" r="7" fill="#1D2430" stroke="#FFFFFF" stroke-width="2"/>
<circle cx="909" cy="186" r="7" fill="#1D2430" stroke="#FFFFFF" stroke-width="2"/>
<circle cx="862" cy="420" r="7" fill="#1D2430" stroke="#FFFFFF" stroke-width="2"/>
<circle cx="885" cy="420" r="7" fill="#1D2430" stroke="#FFFFFF" stroke-width="2"/>
<circle cx="909" cy="420" r="7" fill="#1D2430" stroke="#FFFFFF" stroke-width="2"/>
<text x="56.0" y="644.0" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="15" fill="#5B6675" font-weight="normal" font-style="normal" text-anchor="start">Dots: blind test of 6 papers, labels revealed afterwards (2 human → A, 1 pipeline paper → C, 3 AI papers → D).</text>
<text x="56.0" y="670.0" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="15" fill="#1D2430" font-weight="bold" font-style="normal" text-anchor="start">B and D are separated by the research axis alone. Ordinary weaknesses go to a separate Q axis.</text>
</svg>
