name: Checks
on:
  push:
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Evidence IDs match across EVIDENCE.md, EVIDENCE_CN.md, the index and both skills
        run: python tools/sync_evidence.py --check
      - name: Lint unit tests
        run: python tools/test_slop_lint.py
      - name: Reference, number and hidden-text tool tests
        run: |
          pip install pymupdf
          python -m unittest tools/test_ref_verify.py tools/test_number_ledger.py tools/test_pdf_hidden_text.py
      - name: Site data builds
        run: python tools/build_site_data.py
      - name: Repository owner placeholder has been replaced (run tools/set_repo.sh)
        run: |
          if grep -rnE "OWNER(/|[.]github[.]io/)absent-author" --include='*.md' --include='*.html' --include='*.js' --include='*.cff' --include='*.yml' . | grep -v "tools/set_repo.sh" | grep -v "checks.yml"; then
            echo "::error::Run tools/set_repo.sh <your-github-name> to replace the OWNER placeholder"; exit 1; fi
